name: PR Agent Review

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

jobs:
  pr_agent:
    runs-on: ubuntu-latest
    steps:
      - name: Run PR-Agent
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
